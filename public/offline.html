<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OFFLINE — REGURDO</title>
  <meta name="theme-color" content="#0b0b0b" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0b0b;
      color: #ece7df;
      font-family: "Montserrat", ui-sans-serif, system-ui, sans-serif;
      text-align: center;
      padding: 24px;
    }
    main { max-width: 420px; }
    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(40px, 10vw, 64px);
      font-weight: 500;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }
    p { color: #9a948a; line-height: 1.7; font-size: 15px; margin-bottom: 32px; }
    button {
      appearance: none;
      border: 1px solid #2e2e2e;
      background: #141414;
      color: #ece7df;
      font: inherit;
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 12px 32px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #191919; border-color: #3a3a3a; }
    #status { margin-top: 20px; font-size: 12px; color: #5c574f; letter-spacing: 0.08em; }
  </style>
</head>
<body>
  <main>
    <h1>OFFLINE</h1>
    <p>Kamu sedang tidak terhubung ke internet. Foto-foto yang pernah dibuka tetap bisa dilihat — buka kembali galerinya setelah koneksi kembali.</p>
    <button onclick="location.reload()">Coba Lagi</button>
    <div id="status" hidden>koneksi kembali — memuat ulang…</div>
  </main>
  <script>
    window.addEventListener("online", function () {
      document.getElementById("status").hidden = false;
      setTimeout(function () { location.reload(); }, 600);
    });
  </script>
</body>
</html>
